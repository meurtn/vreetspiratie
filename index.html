<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vreetspiratie</title>
<meta name="theme-color" content="#4A2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vreetspiratie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EA; --vlak:#FFFFFF; --inkt:#1E2420; --zacht:#5E665F; --lijn:#D9DDD3;
  --aub:#4A2545; --aub-licht:#EFE4EC; --mos:#E3A51C; --mos-inkt:#2A1A00;
  --rood:#B3261E;
  --kop:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --tekst:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#161917; --vlak:#212622; --inkt:#ECEFE8; --zacht:#A3AAA2; --lijn:#343A35;
    --aub:#C996BE; --aub-licht:#3A2637; --mos:#F0B53A; --mos-inkt:#2A1A00; --rood:#FF8A80; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--inkt);font:16px/1.45 var(--tekst);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mos);outline-offset:2px}
.verborgen{display:none!important}

/* Kop */
.kop{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--st) + 10px) 16px 8px}
.kop-rij{display:flex;align-items:center;gap:8px}
.titel{font:800 30px/1 var(--kop);letter-spacing:-.02em;margin:0;flex:1;color:var(--aub)}
.icoonknop{width:42px;height:42px;border-radius:50%;border:0;background:var(--vlak);display:grid;place-items:center}
.icoonknop svg{width:22px;height:22px}
.zoekrij{display:flex;gap:8px;margin-top:12px}
.zoek{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--lijn);background:var(--vlak);padding:0 16px}
.sorteer{flex:none;height:42px;border-radius:21px;border:1px solid var(--lijn);background:var(--vlak);padding:0 10px;font-size:15px}

.tabs{display:flex;gap:4px;margin-top:12px;background:var(--vlak);border-radius:14px;padding:4px}
.tab{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--zacht);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--aub);color:var(--vlak)}
@media (prefers-color-scheme:dark){.tab[aria-selected="true"]{color:#1b0f19}}
.teller{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--mos);color:var(--mos-inkt);font-size:12px;line-height:20px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--lijn);background:var(--vlak);border-radius:16px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--aub);border-color:var(--aub);color:var(--vlak)}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#1b0f19}}
.chip small{opacity:.6;margin-left:3px}
.icoonknop{position:relative}
.icoonknop.actief{background:var(--aub-licht);color:var(--aub)}
.bolletje{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--mos);color:var(--mos-inkt);font-size:11px;font-weight:700;line-height:18px}
.filterrij{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:center;gap:6px;margin-top:8px}
.rijlabel{font-size:12px;font-weight:700;line-height:1.15;color:var(--zacht)}
.filterrij .chips{padding:2px 16px 2px 0;margin:0 -16px 0 0}
.filtervoet{display:flex;justify-content:space-between;margin-top:2px}
.filteruitleg{margin:10px 0 0}
.taggroep{margin-bottom:12px}
.groeplabel{display:block;font-size:12px;font-weight:700;color:var(--zacht);margin-bottom:6px}
.groepkop{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.groepkop h3{flex:1;margin:0!important}
.mini-knop{border:0;background:var(--bg);color:var(--aub);font-weight:700;border-radius:10px;min-width:34px;height:32px;padding:0 10px}
.mini-knop:disabled{opacity:.35}
.nieuwetag select{height:38px;border-radius:19px;border:1px solid var(--lijn);background:var(--vlak);padding:0 8px;max-width:38%}
.blok .nieuwetag input,.blok .nieuwetag select{background:var(--bg)}
.blok .chip{background:var(--bg)}
.blok .chip[aria-pressed="true"]{background:var(--aub)}

/* Overzicht */
main{padding:8px 16px calc(var(--sb) + 110px)}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tegel{position:relative;border:0;padding:0;background:none;text-align:left}
.tegel .foto{aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--aub-licht);display:grid;place-items:center}
.tegel img{width:100%;height:100%;object-fit:cover;display:block}
.letter{font:800 54px/1 var(--kop);color:var(--aub);opacity:.55}
.tegel .naam{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 16px/1.2 var(--kop);margin:7px 2px 0}
.cijfer{position:absolute;top:-6px;right:-6px;min-width:46px;height:46px;border-radius:23px;padding:0 6px;display:grid;place-items:center;
  font:800 19px/1 var(--kop);color:#fff;border:3px solid var(--bg);font-variant-numeric:tabular-nums}
.cijfer.leeg{background:var(--lijn)!important;color:var(--zacht);font-size:15px}

.lijst{display:flex;flex-direction:column;gap:2px}
.regel{display:flex;align-items:center;gap:12px;border:0;background:var(--vlak);padding:8px 12px 8px 8px;border-radius:14px;text-align:left;width:100%}
.regel .mini{width:52px;height:52px;flex:none;border-radius:12px;overflow:hidden;background:var(--aub-licht);display:grid;place-items:center}
.regel .mini img{width:100%;height:100%;object-fit:cover}
.regel .mini .letter{font-size:24px}
.regel .wat{flex:1;min-width:0}
.regel .naam{display:block;font:700 16px/1.2 var(--kop)}
.regel .sub{display:block;font-size:13px;color:var(--zacht);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.regel .cijfer{position:static;border:0;min-width:42px;height:42px;font-size:17px}
.regel .mist{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mist span{font-size:12px;border-radius:8px;padding:1px 8px;background:var(--aub-licht);color:var(--aub);font-weight:600}

.leegte{text-align:center;padding:60px 20px;color:var(--zacht)}
.leegte b{display:block;font:700 22px/1.2 var(--kop);color:var(--inkt);margin-bottom:6px}

/* Onderbalk */
.onder{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:12px;padding:12px 16px calc(var(--sb) + 14px);
  background:linear-gradient(to top,var(--bg) 60%,transparent);pointer-events:none}
.onder button{pointer-events:auto;border:0;height:56px;border-radius:28px;font:700 18px/1 var(--kop);box-shadow:0 6px 20px rgba(40,20,40,.22)}
.verras{background:var(--aub);color:#fff;padding:0 26px}
@media (prefers-color-scheme:dark){.verras{color:#1b0f19}}
.plus{background:var(--mos);color:var(--mos-inkt);width:56px;font-size:30px!important}

/* Vellen (modals) */
.vel-achter{position:fixed;inset:0;z-index:20;background:rgba(20,15,20,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.vel{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - var(--st) - 20px);overflow:auto;border-radius:24px 24px 0 0;
  padding:18px 18px calc(var(--sb) + 20px);animation:omhoog .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:600px){.vel-achter{align-items:center}.vel{border-radius:24px;padding-bottom:20px}}
@keyframes omhoog{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.vel,.vel-achter{animation:none}}
.vel h2{font:800 24px/1.15 var(--kop);margin:0 0 14px}
.vel-kop{display:flex;align-items:flex-start;gap:8px}
.vel-kop h2{flex:1}

.veld{margin-bottom:16px}
.veld>label,.veldlabel{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--zacht)}
.invoer{width:100%;height:46px;border-radius:12px;border:1px solid var(--lijn);background:var(--vlak);padding:0 14px}
.fotokeuze{width:100%;aspect-ratio:4/3;border-radius:18px;border:2px dashed var(--lijn);background:var(--vlak);display:grid;place-items:center;overflow:hidden;padding:0;color:var(--zacht);font-weight:600}
.fotokeuze img{width:100%;height:100%;object-fit:cover}
.fotoacties{display:flex;gap:8px;margin-top:8px}
.segment{display:flex;background:var(--vlak);border-radius:12px;padding:4px;gap:4px}
.segment button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--zacht)}
.segment button[aria-pressed="true"]{background:var(--aub);color:#fff}
@media (prefers-color-scheme:dark){.segment button[aria-pressed="true"]{color:#1b0f19}}
.tagkeuze{display:flex;flex-wrap:wrap;gap:6px}
.nieuwetag{display:flex;gap:6px;margin-top:8px}
.nieuwetag input{flex:1;height:38px;border-radius:19px;border:1px solid var(--lijn);background:var(--vlak);padding:0 14px;min-width:0}

.score{background:var(--vlak);border-radius:14px;padding:12px;margin-bottom:8px}
.score-kop{display:flex;align-items:center;gap:8px}
.score-kop .wie{flex:1;font-weight:700}
.score-kop .wie small{font-weight:400;color:var(--zacht)}
.stap{width:38px;height:38px;border-radius:50%;border:1px solid var(--lijn);background:var(--bg);font-size:20px;line-height:1}
.scorewaarde{width:64px;height:42px;text-align:center;border-radius:10px;border:1px solid var(--lijn);background:var(--bg);font:800 20px/1 var(--kop)}
.schuif{width:100%;margin:10px 0 2px;accent-color:var(--aub)}
.linkknop{border:0;background:none;color:var(--aub);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.knoppen{display:flex;gap:10px;margin-top:18px}
.knop{flex:1;height:50px;border-radius:14px;border:0;font-weight:700;font-size:16px}
.knop.hoofd{background:var(--aub);color:#fff}
@media (prefers-color-scheme:dark){.knop.hoofd{color:#1b0f19}}
.knop.mos{background:var(--mos);color:var(--mos-inkt)}
.knop.licht{background:var(--vlak)}
.knop.gevaar{background:none;color:var(--rood);flex:none;padding:0 6px}
.knop:disabled{opacity:.5}

/* Detail */
.detailfoto{width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--aub-licht);display:grid;place-items:center;margin-bottom:14px}
.detailfoto img{width:100%;height:100%;object-fit:cover}
.detailfoto .letter{font-size:110px}
.scores-rij{display:flex;gap:10px;margin:14px 0}
.scorevak{flex:1;background:var(--vlak);border-radius:14px;padding:10px;text-align:center}
.scorevak b{display:block;font:800 30px/1.1 var(--kop);font-variant-numeric:tabular-nums}
.scorevak span{font-size:13px;color:var(--zacht)}
.scorevak.gem{color:#fff}
.scorevak.gem span{color:inherit;opacity:.85}

/* Verras ons */
.verras-kaart{text-align:center}
.verras-kaart .detailfoto{max-width:320px;margin:0 auto 14px}
.cijfer.los{position:static;display:inline-grid;border:0}
.verras-naam{font:800 30px/1.1 var(--kop);margin:4px 0 6px;min-height:1.1em}
.schud{animation:schud .09s}
@keyframes schud{from{transform:translateY(-6px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.schud{animation:none}}

/* Instellingen */
.blok{background:var(--vlak);border-radius:16px;padding:14px;margin-bottom:12px}
.blok .knop.licht,.blok .segment{background:var(--bg)}
.blok h3{font:700 17px/1.2 var(--kop);margin:0 0 10px}
.code{font:800 26px/1 var(--kop);letter-spacing:.06em;color:var(--aub);margin:4px 0 10px;user-select:all}
.tagregel{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--lijn)}
.tagregel:first-of-type{border-top:0}
.tagregel span{flex:1}
.tagregel button{border:0;background:none;color:var(--aub);font-weight:600;padding:4px}
.uitleg{font-size:14px;color:var(--zacht);margin:0 0 10px}

/* Welkom */
.welkom{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 30px) 24px calc(var(--sb) + 30px);max-width:480px;margin:0 auto}
.welkom img{width:88px;height:88px;border-radius:22px}
.welkom h1{font:800 44px/1 var(--kop);letter-spacing:-.03em;color:var(--aub);margin:18px 0 10px}
.welkom p{color:var(--zacht);margin:0 0 24px}
.welkom .knop{flex:none;width:100%;margin-bottom:10px}

.melding{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%);z-index:40;background:var(--inkt);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;max-width:90%;text-align:center}
.demo{background:var(--mos);color:var(--mos-inkt);font-size:13px;font-weight:600;text-align:center;padding:6px 10px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
